<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Apply the saved theme and reveal-animation class before first paint to avoid a flash.
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem("gp-theme");
          if (saved === "dark" || saved === "light") root.dataset.theme = saved;
        } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!reduce && "IntersectionObserver" in window) root.classList.add("js-reveal");
      })();
    </script>
    <title>Garima Pahwa — Software Engineer</title>
    <meta
      name="description"
      content="Garima Pahwa — Software Engineer at Becton Dickinson in Bangalore. .NET microservices, shared libraries, Helm and DevOps, applied AI, and published machine-learning research."
    />
    <meta property="og:title" content="Garima Pahwa — Software Engineer" />
    <meta
      property="og:description"
      content="Backend systems, microservices, ML research, hackathons and community — field notes from Bangalore."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f5f5f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Vercel Web Analytics (enable it in the Vercel project → Analytics). Sections live at #/<id>,
         so report them as /<id> paths; otherwise every page would count as the home page. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.va("beforeSend", function (event) {
        var url = new URL(event.url);
        if (url.hash.indexOf("#/") === 0) {
          url.pathname = url.hash.slice(1) || "/";
          url.hash = "";
        }
        return Object.assign({}, event, { url: url.toString() });
      });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
